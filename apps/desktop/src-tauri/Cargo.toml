[package]
name = "aloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform voice dictation"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# would otherwise collide on Windows. See rust-lang/cargo#8519.
name = "aloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Only for the build date. Already a dependency of this crate, so it costs
# nothing to compile that was not being compiled anyway.
chrono = "0.4"

[dependencies]
aloud-agent = { path = "../../../crates/agent" }
aloud-agent-spawn = { path = "../../../crates/agent-spawn" }
aloud-audio = { path = "../../../crates/audio" }
aloud-drag = { path = "../../../crates/drag" }
aloud-meeting = { path = "../../../crates/meeting" }
aloud-engine = { path = "../../../crates/engine" }
aloud-native = { path = "../../../crates/native" }
aloud-hotkey = { path = "../../../crates/hotkey" }
aloud-focus = { path = "../../../crates/focus" }
aloud-islands = { path = "../../../crates/islands" }
aloud-llm = { path = "../../../crates/llm" }
aloud-notes = { path = "../../../crates/notes" }
aloud-quota = { path = "../../../crates/quota" }
aloud-sessions = { path = "../../../crates/sessions" }
aloud-bridge = { path = "../../../crates/bridge" }
aloud-paste = { path = "../../../crates/paste" }
aloud-permissions = { path = "../../../crates/permissions" }
aloud-volume = { path = "../../../crates/volume" }
aloud-selection = { path = "../../../crates/selection" }
aloud-store = { path = "../../../crates/store" }
aloud-today = { path = "../../../crates/today" }
aloud-transcribe = { path = "../../../crates/transcribe" }
anyhow.workspace = true
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
# macos-private-api: required for a genuinely transparent window on macOS,
# which the recording overlay depends on. It rules out Mac App Store
# distribution, which this app does not use (it ships as a notarized DMG).
# `protocol-asset` is what serves the Run Log's kept recordings to the webview.
# It is gated by `app.security.assetProtocol.scope` in tauri.conf.json, not by
# a capability: Tauri v2 ships no `core:asset` permission, so the scope list is
# the only thing standing between a window and the filesystem.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tokio = { version = "1", features = ["time", "sync"] }
# Only to pick the TLS crypto provider at startup — see `run`.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# Native NSVisualEffectView vibrancy behind the main window (macOS Liquid Glass).
window-vibrancy = "0.5"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"

# Reading the MacBook notch geometry (NSScreen) so the wings overlay welds to
# it. Already a transitive dep via tauri/wry; pinned to the 0.2 line to share
# objc2 0.5 rather than pulling a second major.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2", features = ["NSScreen", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSGeometry"] }
# `NSScreen.screens` hands back a Swift-bridged array whose `count` reports an
# unsigned `NSUInteger` ('Q'); objc2's debug-only encoding check expects the
# signed 'q' and aborts the process at launch. This relaxes the sign check to
# treat the two as compatible. Enabled here (a direct dep) so feature
# unification turns it on for the objc2 the app-kit/foundation crates share.
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }

[dev-dependencies]
hound = "3.5"
