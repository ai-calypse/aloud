[package]
name = "aloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform voice dictation"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# would otherwise collide on Windows. See rust-lang/cargo#8519.
name = "aloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aloud-audio = { path = "../../../crates/audio" }
aloud-hotkey = { path = "../../../crates/hotkey" }
aloud-llm = { path = "../../../crates/llm" }
aloud-notes = { path = "../../../crates/notes" }
aloud-paste = { path = "../../../crates/paste" }
aloud-store = { path = "../../../crates/store" }
aloud-transcribe = { path = "../../../crates/transcribe" }
anyhow.workspace = true
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
