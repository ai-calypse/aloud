# Generate the Xcode project with `xcodegen` (brew install xcodegen), then open SpeakOS.xcodeproj.
name: SpeakOS
options:
  bundleIdPrefix: app.speakos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpeakOS:
    type: application
    platform: iOS
    sources: [SpeakOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.speakos.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: SpeakOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  SpeakOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpeakOSTests]
    dependencies:
      - target: SpeakOS
schemes:
  SpeakOS:
    build:
      targets:
        SpeakOS: all
    test:
      targets: [SpeakOSTests]
