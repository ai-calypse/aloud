[package]
name = "aloud-hotkey"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Global hotkeys with hold, toggle, and modifier-only bindings"

[dependencies]
anyhow.workspace = true
serde.workspace = true
specta.workspace = true
tracing.workspace = true

[dev-dependencies]
# The keys example moves the real volume the way the app does, and puts it back.
aloud-media = { path = "../media" }
tracing-subscriber = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"
# Same pin and feature as aloud-mac: NSEvent is the only reader of a media key.
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
