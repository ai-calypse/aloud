[package]
name = "aloud-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent mode: turn a spoken command into an executed action"

[dependencies]
aloud-llm = { path = "../llm" }
aloud-engine = { path = "../engine" }
aloud-native = { path = "../native" }
aloud-screen = { path = "../screen" }
aloud-selection = { path = "../selection" }
anyhow.workspace = true
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
iana-time-zone = "0.1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["time", "macros", "sync"] }

[dev-dependencies]
aloud-notes = { path = "../notes" }
aloud-store = { path = "../store" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
