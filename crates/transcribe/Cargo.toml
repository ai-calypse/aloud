[package]
name = "aloud-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speech-to-text via local whisper or an OpenAI-compatible API"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
hound = "3.5"
# rustls (not native-tls) so TLS behaves identically on macOS and Windows.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "rustls",
  "stream",
] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "sync", "rt", "macros"] }
# Always-listening's live stream to Deepgram. rustls for the same reason as reqwest.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
whisper-rs = "0.16"
# Used unconditionally (model download stream, data_dir), so they must be
# cross-platform deps — not macOS-only, or Windows fails to compile.
futures-util = "0.3"
aloud-notes = { path = "../notes" }
# For the chunk-level entry point: the realtime tap's PCM16 has to become the
# 16 kHz WAV both engines take, and `write_pcm16_wav` already does exactly that.
aloud-audio = { path = "../audio" }

# GPU acceleration where it is free: Metal on macOS. Windows stays CPU-only
# for now (whisper-rs offers cuda/vulkan features, but both need a matching
# SDK on the build machine).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
tracing-subscriber = "0.3"
