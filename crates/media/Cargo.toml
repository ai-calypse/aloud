[package]
name = "aloud-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The notch's Media section: now playing, lyrics, audio devices and device batteries"

[dependencies]
anyhow.workspace = true
aloud-native = { path = "../native" }
aloud-notes = { path = "../notes" }
aloud-selection = { path = "../selection" }
base64 = "0.22"
# rustls, like aloud-llm and aloud-quota: the same TLS on macOS and Windows.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio = { version = "1", features = ["rt"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# CFString for device names; already in the tree through security-framework.
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tracing-subscriber = "0.3"
