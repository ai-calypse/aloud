[package]
name = "aloud-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clipboard history, snippets and picked colours, kept on this Mac"

[dependencies]
aloud-paste = { path = "../paste" }
anyhow.workspace = true
arboard = "3.6"
base64 = "0.22"
# png only: the history stores images as PNG files and a small PNG thumbnail.
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSColorSampler", "NSColor", "NSColorSpace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
