[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

# Full debug info made target/ reach 159 GB across worktrees; line tables keep
# file:line in backtraces at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
