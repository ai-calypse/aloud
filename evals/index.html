<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aloud evals</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23dfe8cb'/%3E%3Cpath d='M8 13v6m5-10v14m5-17v20m5-13v6' stroke='%23343e29' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brandmark" aria-hidden="true">▍▌█▌▍</span>aloud <span class="brand-sub">evals</span></div>
    <div class="nav-label eyebrow">Workspace</div>
    <nav class="nav">
      <button data-tab="overview">Overview</button>
      <button data-tab="evals">Eval runs <small id="runCount"></small></button>
      <button data-action="definitions">Definitions</button>
    </nav>
    <p class="sidebar-note">From a spoken word<br>to the right result.</p>
    <p class="sidebar-foot" id="dataDir"></p>
  </aside>
  <div class="app">
    <header class="topbar">
      <div>Aloud <span class="crumb">/</span> <strong>Eval studio</strong></div>
      <div class="live"><span class="dot"></span><span id="freshness">Loading…</span> <button class="text-button" data-action="refresh">Refresh</button></div>
    </header>
    <main id="main" aria-live="polite"><p class="sub">Reading eval runs and traces…</p></main>
  </div>
</div>
<dialog id="drawer" class="drawer"><div class="drawer-top"><span class="eyebrow" id="drawerEyebrow"></span><button class="icon-button" data-action="close" aria-label="Close">✕</button></div><div id="drawerBody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
